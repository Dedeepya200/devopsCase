apiVersion: apps/v1
kind: Deployment
metadata:
  name: queueflow
  namespace: queueflow
  labels:
    app: queueflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queueflow
  template:
    metadata:
      labels:
        app: queueflow
    spec:
      containers:
        - name: queueflow
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi